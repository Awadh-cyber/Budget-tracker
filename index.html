<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Budget Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Budget Tracker</h1>
        <p class="subtitle">Where my money goes</p>
      </div>
      <div class="account" id="account" hidden>
        <span class="account-email" id="account-email"></span>
        <button type="button" class="secondary" id="logout-button">Log out</button>
      </div>
    </header>

    <p class="message" id="app-loading" role="status">Loading…</p>

    <section class="panel auth" id="auth-view" hidden>
      <div class="tabs" role="tablist">
        <button type="button" role="tab" class="tab" id="login-tab" aria-selected="true">Log in</button>
        <button type="button" role="tab" class="tab" id="signup-tab" aria-selected="false">Create account</button>
      </div>
      <form id="auth-form">
        <label class="wide" data-signup-only hidden>
          First name
          <input name="first_name" autocomplete="given-name" disabled>
        </label>
        <label class="wide" data-signup-only hidden>
          Second name (optional)
          <input name="second_name" autocomplete="additional-name" disabled>
        </label>
        <label class="wide" data-signup-only hidden>
          Last name
          <input name="last_name" autocomplete="family-name" disabled>
        </label>
        <label class="wide">
          Email
          <input name="email" type="email" autocomplete="email" required placeholder="you@example.com">
        </label>
        <label class="wide">
          <span id="password-label">Password</span>
          <span class="password-field">
            <input name="password" type="password" autocomplete="current-password" minlength="6" required>
            <button type="button" class="link" id="toggle-password" aria-pressed="false" aria-label="Show password">Show</button>
          </span>
        </label>
        <button type="submit" id="auth-submit">Log in</button>
      </form>
      <p class="message" id="auth-message" role="status"></p>
      <p class="switch" id="auth-switch">No account yet? <button type="button" class="link" id="auth-switch-button">Create one</button></p>
      <p class="switch" id="resend" hidden><button type="button" class="link" id="resend-button">Send the confirmation email again</button></p>
    </section>

    <div id="app-view" hidden>
    <section class="summary" aria-label="Summary">
      <div class="card">
        <span class="label">Spent today</span>
        <span class="value" id="today-total">–</span>
      </div>
      <div class="card">
        <span class="label">Spent this month</span>
        <span class="value" id="month-total">–</span>
      </div>
      <div class="card">
        <span class="label">Biggest spend</span>
        <span class="value" id="biggest">–</span>
        <span class="hint" id="biggest-item"></span>
      </div>
    </section>

    <section class="panel">
      <h2>Add an expense</h2>
      <form id="expense-form">
        <label>
          What did you buy?
          <input name="item" required placeholder="Lunch at a café">
        </label>
        <label>
          Amount (KD)
          <input name="amount" type="number" step="0.001" min="0.001" required placeholder="3.500">
        </label>
        <div class="field">
          <span class="label-row">
            <label for="category">Category</label>
            <button type="button" class="link" id="suggest-button">✨ Suggest</button>
          </span>
          <select name="category" id="category" required>
            <option>Food</option>
            <option>Transport</option>
            <option>Bills</option>
            <option>Shopping</option>
            <option>Fun</option>
            <option>Other</option>
          </select>
          <span class="hint" id="suggest-message" role="status"></span>
        </div>
        <label>
          Date
          <input name="spent_on" type="date" required>
        </label>
        <label>
          Paid with
          <select name="payment_method">
            <option value="">—</option>
            <option>Card</option>
            <option>Cash</option>
            <option>K-Net</option>
          </select>
        </label>
        <label>
          Need or want?
          <select name="is_need">
            <option value="">—</option>
            <option value="true">Need</option>
            <option value="false">Want</option>
          </select>
        </label>
        <label class="wide">
          Note
          <input name="note" placeholder="Optional">
        </label>
        <label class="wide">
          Receipt photo
          <input name="receipt" type="file" accept="image/jpeg,image/png,image/webp,image/heic,application/pdf">
        </label>
        <button type="submit">Add expense</button>
      </form>
      <p class="message" id="form-message" role="status"></p>
    </section>

    <section class="panel">
      <div class="list-head">
        <h2>Expenses</h2>
        <select id="category-filter" aria-label="Filter by category">
          <option value="">All categories</option>
        </select>
      </div>
      <p class="message" id="list-message" role="status">Loading…</p>
      <ul id="expense-list"></ul>
    </section>
    </div>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
